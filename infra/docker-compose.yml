version: "3.9"
services:
  db:
    image: postgres:14
    restart: unless-stopped
    ports: [ "5432:5432" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_secretary
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports: [ "6379:6379" ]

volumes:
  db_data:
